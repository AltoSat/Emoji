<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>絵文字ノート</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel2: #1b2130;
    --border: #262e3f;
    --text: #e7ebf3;
    --muted: #8a93a8;
    --accent: #4f8cff;
    --fav: #f5a524;
    --unused: #5b6478;
    --danger: #ef4444;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior-y: none;
    min-height: 100%;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }

  /* ---- Topbar ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11,13,18,.95);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 8px 4px;
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1 1 auto;
  }
  .app-title .logo { font-size: 22px; line-height: 1; }
  .app-title .txt { font-size: 15px; font-weight: 700; letter-spacing: .2px; }

  .icon-btn {
    min-width: 34px;
    height: 34px;
    padding: 0 7px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    flex: 0 0 auto;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 列数コントロール */
  .col-control {
    display: inline-flex;
    align-items: center;
    gap: 0;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .col-control button {
    width: 30px;
    height: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 17px;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .col-control button:active { background: var(--panel2); }
  .col-control button:disabled {
    color: #444c60;
    cursor: default;
  }
  .col-control .col-value {
    min-width: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--text);
    padding: 0 4px;
    font-variant-numeric: tabular-nums;
    user-select: none;
    -webkit-user-select: none;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 4px 10px 10px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 46vw;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: inherit;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab.add-folder { border-style: dashed; color: var(--muted); padding: 8px 12px; }

  /* ---- Mode bar ---- */
  .mode-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(79,140,255,.10);
    border-top: 1px solid rgba(79,140,255,.25);
    font-size: 12.5px;
    color: #b9cdfb;
  }
  .mode-bar.show { display: flex; }
  .mode-bar .grow { flex: 1 1 auto; }
  .mode-bar .mini-btn {
    padding: 6px 11px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .mode-bar .mini-btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  /* ---- Grid ---- */
  .grid {
    display: grid;
    gap: 8px;
    padding: 12px 10px;
    position: relative;
  }
  .grid[data-cols="5"] { grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px 6px; }
  .grid[data-cols="4"] { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 8px; }
  .grid[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
  .grid[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }

  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    touch-action: pan-y;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: inherit;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .grid[data-cols="2"] .tile { border-radius: 18px; }
  .grid[data-cols="5"] .tile { border-radius: 10px; }

  .tile .char {
    display: block;
    line-height: 1;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    transition: transform .15s;
  }

  /* 名前表示 */
  .tile .name {
    display: none;
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 4px;
    font-size: 11px;
    line-height: 1.2;
    color: var(--text);
    background: rgba(0,0,0,.62);
    padding: 2px 6px;
    border-radius: 7px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
    z-index: 3;
  }
  body.show-names .tile.has-name .name { display: block; }

  .grid[data-cols="5"] .tile .name,
  .grid[data-cols="4"] .tile .name { font-size: 9px; padding: 1px 4px; left: 3px; right: 3px; bottom: 3px; }

  .tile.fav {
    border-color: rgba(245,165,36,.5);
    background: rgba(245,165,36,.08);
  }
  .tile.unused { opacity: .38; }
  .tile.selected {
    border-color: var(--accent);
    background: rgba(79,140,255,.20);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .tile.selected::after {
    content: '✓';
    position: absolute;
    top: 3px;
    left: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    pointer-events: none;
    z-index: 4;
  }

  .tile .mark {
    position: absolute;
    top: 3px;
    right: 6px;
    font-size: 11px;
    color: var(--fav);
    pointer-events: none;
    z-index: 4;
  }
  .tile.unused .mark { color: var(--unused); }

  .tile.swipe-fav {
    border-color: var(--fav);
    box-shadow: 0 0 0 2px rgba(245,165,36,.5) inset;
  }
  .tile.swipe-unused {
    border-color: var(--muted);
    box-shadow: 0 0 0 2px rgba(138,147,168,.45) inset;
  }

  body.mode-edit .tile { touch-action: none; cursor: grab; }
  body.mode-edit .tile.add-tile { touch-action: manipulation; }
  body.mode-select .tile { touch-action: manipulation; }
  body.mode-edit .tab,
  body.mode-select .tab { touch-action: manipulation; }

  .tile.dragging { opacity: .18; }

  .drag-ghost {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 999;
    pointer-events: none;
    opacity: .95;
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(0,0,0,.65);
    border: 1px solid var(--accent);
    background: var(--panel2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    will-change: transform;
  }
  .drag-ghost .char { line-height: 1; pointer-events: none; }

  .insert-line {
    position: absolute;
    width: 4px;
    border-radius: 4px;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(79,140,255,.65);
    pointer-events: none;
    z-index: 20;
    display: none;
    transition: left .09s ease-out, top .09s ease-out, height .09s ease-out;
  }

  .tile.add-tile {
    border-style: dashed;
    background: transparent;
    color: var(--muted);
  }
  .tile.add-tile .plus {
    font-size: 34px;
    line-height: 1;
    font-weight: 300;
  }
  .grid[data-cols="5"] .tile.add-tile .plus,
  .grid[data-cols="4"] .tile.add-tile .plus { font-size: 26px; }

  .empty-note {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
    padding: 26px 12px;
  }

  /* ---- Bottom bar ---- */
  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    background: rgba(20,24,33,.96);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
  }

  #inputArea {
    flex: 1 1 auto;
    min-height: 42px;
    max-height: 130px;
    resize: none;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.4;
    outline: none;
    transition: border-color .15s;
  }
  #inputArea:focus { border-color: var(--accent); }

  #copyInputBtn {
    height: 42px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    flex: 0 0 auto;
    user-select: none;
    -webkit-user-select: none;
  }
  #copyInputBtn:active { background: var(--panel2); }

  /* ---- Modal ---- */
  .modal-root {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-root.hidden { display: none; }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.62);
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-panel {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    animation: slideUp .2s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideUp {
    from { transform: translateY(26px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
  }
  .modal-message {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 4px;
    white-space: pre-wrap;
  }
  .modal-textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  .modal-textarea:focus { border-color: var(--accent); }
  .modal-input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  .modal-input:focus { border-color: var(--accent); }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .modal-list { display: flex; flex-direction: column; gap: 2px; }
  .modal-item {
    width: 100%;
    text-align: left;
    padding: 14px 12px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .modal-item:active { background: rgba(255,255,255,.07); }
  .modal-item.danger { color: var(--danger); }

  .btn {
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    background: #232a3a;
    color: #fff;
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 400;
    max-width: 86vw;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .storage-warning {
    display: none;
    margin: 0 10px 8px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(245,165,36,.12);
    border: 1px solid rgba(245,165,36,.35);
    color: #f3c37a;
    font-size: 12px;
  }
  .storage-warning.show { display: block; }
</style>
</head>
<body>

<header class="topbar">
  <div class="title-row">
    <div class="app-title" title="絵文字ノート">
      <span class="logo">🗂️</span>
      <span class="txt">絵文字ノート</span>
    </div>
    <button class="icon-btn" id="nameBtn" type="button" title="名前表示">🏷️</button>
    <button class="icon-btn" id="editBtn" type="button" title="並び替え">↕️</button>
    <button class="icon-btn" id="selectBtn" type="button" title="選択">☑️</button>
    <div class="col-control" aria-label="列数">
      <button id="colDec" type="button" title="列を減らす">−</button>
      <span class="col-value" id="colValue">3</span>
      <button id="colInc" type="button" title="列を増やす">＋</button>
    </div>
    <button class="icon-btn" id="menuBtn" type="button" title="メニュー">⋯</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="storage-warning" id="storageWarning">
    この環境では保存領域が使えないため、閉じるとデータは消えます。
  </div>

  <div class="mode-bar" id="modeBar"></div>
</header>

<main class="grid" id="grid" data-cols="3"></main>

<div class="bottom-bar">
  <textarea id="inputArea" rows="1" placeholder="絵文字をタップ"></textarea>
  <button id="copyInputBtn" type="button">コピー</button>
</div>

<div class="modal-root hidden" id="modalRoot">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-panel" id="modalPanel"></div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =====================================================
     定数
  ===================================================== */
  var STORAGE_KEY   = 'emoji-registry-v5';
  var LEGACY_KEYS   = ['emoji-registry-v4', 'emoji-registry-v3', 'emoji-registry-v2', 'emoji-registry-v1'];
  var COLS_KEY      = 'emoji-registry-cols-v5';
  var NAMES_KEY     = 'emoji-registry-names-v5';

  var STATUS_ORDER = { favorite: 0, normal: 1, unused: 2 };

  var COLS_MIN = 2;
  var COLS_MAX = 5;
  var COLS_DEFAULT = 3;

  function $(id) { return document.getElementById(id); }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* =====================================================
     ストレージ
  ===================================================== */
  var storageAvailable = (function () {
    try {
      var k = '__t__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })();

  var memoryStore = {};

  function storageGet(key) {
    if (storageAvailable) {
      try { return window.localStorage.getItem(key); } catch (e) {}
    }
    return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
  }

  function storageSet(key, value) {
    if (storageAvailable) {
      try { window.localStorage.setItem(key, value); return; } catch (e) {}
    }
    memoryStore[key] = value;
  }

  /* =====================================================
     Toast
  ===================================================== */
  var toastEl = $('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* =====================================================
     データ正規化
  ===================================================== */
  function normalizeEmojis(arr) {
    var out = [];
    if (!Array.isArray(arr)) return out;

    for (var i = 0; i < arr.length; i++) {
      var item = arr[i];

      if (typeof item === 'string') {
        if (item) out.push({ id: uuid(), char: item, status: 'normal', name: '' });
        continue;
      }

      if (item && typeof item === 'object' && typeof item.char === 'string' && item.char) {
        var st = (item.status === 'favorite' || item.status === 'unused') ? item.status : 'normal';
        out.push({
          id: item.id || uuid(),
          char: item.char,
          status: st,
          name: typeof item.name === 'string' ? item.name : ''
        });
      }
    }
    return out;
  }

  function normalizeFolders(raw) {
    if (!raw || typeof raw !== 'object') return null;

    var list = null;
    if (Array.isArray(raw.folders)) list = raw.folders;
    else if (Array.isArray(raw.tabs)) list = raw.tabs;
    if (!list) return null;

    var folders = [];
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (!f || typeof f !== 'object') continue;
      folders.push({
        id: f.id || uuid(),
        name: (typeof f.name === 'string' && f.name.trim()) ? f.name : '無題',
        emojis: normalizeEmojis(f.emojis)
      });
    }
    if (!folders.length) return null;

    folders.forEach(sortEmojis);
    return folders;
  }

  function sortEmojis(folder) {
    folder.emojis.sort(function (a, b) {
      return STATUS_ORDER[a.status] - STATUS_ORDER[b.status];
    });
  }

  /* =====================================================
     状態
  ===================================================== */
  function createDefaultState() {
    var id = uuid();
    return {
      folders: [{ id: id, name: 'マイ絵文字', emojis: [] }],
      activeFolderId: id
    };
  }

  var state = createDefaultState();
  var mode = 'normal';
  var selected = {};
  var showNames = false;

  function loadState() {
    var raw = null;
    var keys = [STORAGE_KEY].concat(LEGACY_KEYS);
    for (var i = 0; i < keys.length; i++) {
      var s = storageGet(keys[i]);
      if (s) { raw = s; break; }
    }

    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        var folders = normalizeFolders(parsed);
        if (folders) {
          var activeId = parsed.activeFolderId;
          if (!folders.some(function (f) { return f.id === activeId; })) {
            activeId = folders[0].id;
          }
          state.folders = folders;
          state.activeFolderId = activeId;
        }
      } catch (e) {}
    }

    var nv = storageGet(NAMES_KEY);
    showNames = nv === '1';
  }

  function save() {
    storageSet(STORAGE_KEY, JSON.stringify({
      version: 5,
      folders: state.folders,
      activeFolderId: state.activeFolderId
    }));
  }

  function getFolder(id) {
    for (var i = 0; i < state.folders.length; i++) {
      if (state.folders[i].id === id) return state.folders[i];
    }
    return null;
  }

  function getActiveFolder() {
    return getFolder(state.activeFolderId) || state.folders[0];
  }

  function getEmojiById(id) {
    for (var i = 0; i < state.folders.length; i++) {
      var list = state.folders[i].emojis;
      for (var j = 0; j < list.length; j++) {
        if (list[j].id === id) return { folder: state.folders[i], emoji: list[j] };
      }
    }
    return null;
  }

  /* =====================================================
     DOM
  ===================================================== */
  var tabsEl    = $('tabs');
  var gridEl    = $('grid');
  var modeBar   = $('modeBar');
  var editBtn   = $('editBtn');
  var selectBtn = $('selectBtn');
  var colDecBtn = $('colDec');
  var colIncBtn = $('colInc');
  var colValue  = $('colValue');
  var menuBtn   = $('menuBtn');
  var nameBtn   = $('nameBtn');
  var inputArea = $('inputArea');

  var modalRoot     = $('modalRoot');
  var modalBackdrop = $('modalBackdrop');
  var modalPanel    = $('modalPanel');
  var fileInput     = $('fileInput');

  /* =====================================================
     モーダル
  ===================================================== */
  function openModal(html, onMount) {
    modalPanel.innerHTML = html;
    modalRoot.classList.remove('hidden');
    if (typeof onMount === 'function') onMount(modalPanel);
  }

  function closeModal() {
    modalRoot.classList.add('hidden');
    modalPanel.innerHTML = '';
  }

  modalBackdrop.addEventListener('click', closeModal);

  function confirmDialog(message, okLabel, onOk) {
    openModal(
      '<div class="modal-title">確認</div>' +
      '<div class="modal-message">' + escapeHtml(message) + '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn" data-act="cancel" type="button">キャンセル</button>' +
        '<button class="btn danger" data-act="ok" type="button">' + escapeHtml(okLabel || 'OK') + '</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
        root.querySelector('[data-act="ok"]').addEventListener('click', function () {
          closeModal();
          onOk();
        });
      }
    );
  }

  /* =====================================================
     列数
  ===================================================== */
  function applyCols(cols) {
    cols = Math.max(COLS_MIN, Math.min(COLS_MAX, cols));
    gridEl.dataset.cols = String(cols);
    colValue.textContent = String(cols);
    colDecBtn.disabled = (cols <= COLS_MIN);
    colIncBtn.disabled = (cols >= COLS_MAX);
    storageSet(COLS_KEY, String(cols));
    requestAnimationFrame(scheduleResizeEmojis);
  }

  function loadCols() {
    var v = parseInt(storageGet(COLS_KEY), 10);
    if (isNaN(v)) return COLS_DEFAULT;
    if (v < COLS_MIN) v = COLS_MIN;
    if (v > COLS_MAX) v = COLS_MAX;
    return v;
  }

  function changeCols(delta) {
    var cur = parseInt(gridEl.dataset.cols, 10) || COLS_DEFAULT;
    applyCols(cur + delta);
  }

  colDecBtn.addEventListener('click', function () { changeCols(-1); });
  colIncBtn.addEventListener('click', function () { changeCols(+1); });

  /* =====================================================
     絵文字サイズ調整
  ===================================================== */
  var sizeRaf = null;

  function scheduleResizeEmojis() {
    if (sizeRaf) cancelAnimationFrame(sizeRaf);
    sizeRaf = requestAnimationFrame(function () {
      sizeRaf = null;
      resizeTileChars();
    });
  }

  function resizeTileChars() {
    var tiles = gridEl.querySelectorAll('.tile');
    for (var i = 0; i < tiles.length; i++) {
      var tile = tiles[i];
      var char = tile.querySelector('.char');
      if (!char) continue;

      var w = tile.clientWidth;
      var h = tile.clientHeight;
      if (!w || !h) continue;

      var base = Math.min(w, h);
      var hasName = tile.classList.contains('has-name') && showNames;

      // 名前表示時は少し縮めて上に寄せる
      var factor = hasName ? 0.52 : 0.86;
      char.style.fontSize = (base * factor) + 'px';
      char.style.transform = hasName ? 'translateY(-12%)' : '';
    }
  }

  window.addEventListener('resize', scheduleResizeEmojis);
  window.addEventListener('orientationchange', scheduleResizeEmojis);

  /* =====================================================
     描画
  ===================================================== */
  function render() {
    renderTabs();
    renderGrid();
    renderModeBar();
    renderToolbar();
    scheduleResizeEmojis();
  }

  function renderToolbar() {
    editBtn.classList.toggle('active', mode === 'edit');
    selectBtn.classList.toggle('active', mode === 'select');
    nameBtn.classList.toggle('active', showNames);
    document.body.classList.toggle('show-names', showNames);
    document.body.classList.toggle('mode-edit', mode === 'edit');
    document.body.classList.toggle('mode-select', mode === 'select');
  }

  function renderTabs() {
    tabsEl.innerHTML = '';

    state.folders.forEach(function (folder) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'tab' + (folder.id === state.activeFolderId ? ' active' : '');
      el.dataset.folder = folder.id;
      el.textContent = folder.name;
      attachTabHandlers(el, folder);
      tabsEl.appendChild(el);
    });

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'tab add-folder';
    addBtn.textContent = '＋';
    addBtn.addEventListener('click', function () {
      if (suppressTap) return;
      openFolderCreate();
    });
    tabsEl.appendChild(addBtn);
  }

  function attachTabHandlers(el, folder) {
    var timer = null;
    var longPressed = false;

    function start() {
      if (suppressTap) return;
      longPressed = false;
      clearTimeout(timer);
      timer = setTimeout(function () {
        longPressed = true;
        openTabMenu(folder);
      }, 480);
    }

    function cancel() {
      clearTimeout(timer);
      timer = null;
    }

    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', function () {
      cancel();
      if (suppressTap) return;
      if (longPressed) return;
      if (state.activeFolderId !== folder.id) {
        state.activeFolderId = folder.id;
        clearSelection();
        save();
        render();
      }
    });
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function renderGrid() {
    var folder = getActiveFolder();
    gridEl.innerHTML = '';

    if (folder.emojis.length === 0 && mode !== 'normal') {
      var note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = '絵文字がありません';
      gridEl.appendChild(note);
      return;
    }

    folder.emojis.forEach(function (item) {
      gridEl.appendChild(makeTile(item, folder.id));
    });

    if (mode === 'normal') {
      var addTile = document.createElement('button');
      addTile.type = 'button';
      addTile.className = 'tile add-tile';
      addTile.innerHTML = '<span class="plus">＋</span>';
      addTile.addEventListener('click', function () {
        if (suppressTap) return;
        openPasteSheet();
      });
      gridEl.appendChild(addTile);
    }

    ensureInsertLine();
  }

  function makeTile(item, folderId) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    if (item.status === 'favorite') btn.classList.add('fav');
    if (item.status === 'unused') btn.classList.add('unused');
    if (selected[item.id]) btn.classList.add('selected');

    var hasName = !!(item.name && item.name.length);
    if (hasName) btn.classList.add('has-name');

    btn.dataset.id = item.id;
    btn.dataset.folder = folderId;
    btn.dataset.char = item.char;
    if (hasName) btn.dataset.name = item.name;

    var span = document.createElement('span');
    span.className = 'char';
    span.textContent = item.char;
    btn.appendChild(span);

    if (hasName) {
      var nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = item.name;
      btn.appendChild(nm);
    }

    if (item.status === 'favorite') {
      var m1 = document.createElement('span');
      m1.className = 'mark';
      m1.textContent = '★';
      btn.appendChild(m1);
    } else if (item.status === 'unused') {
      var m2 = document.createElement('span');
      m2.className = 'mark';
      m2.textContent = '−';
      btn.appendChild(m2);
    }

    return btn;
  }

  function renderModeBar() {
    if (mode === 'normal') {
      modeBar.classList.remove('show');
      modeBar.innerHTML = '';
      return;
    }

    modeBar.classList.add('show');

    if (mode === 'edit') {
      modeBar.innerHTML = '<span class="grow">ドラッグで並び替え</span>';
      return;
    }

    var count = Object.keys(selected).length;
    modeBar.innerHTML =
      '<span class="grow">' + count + ' 個選択中</span>' +
      '<button class="mini-btn" id="selAllBtn" type="button">全選択</button>' +
      '<button class="mini-btn" id="moveSelBtn" type="button">移動</button>' +
      '<button class="mini-btn danger" id="delSelBtn" type="button">削除</button>';

    modeBar.querySelector('#selAllBtn').addEventListener('click', function () {
      var folder = getActiveFolder();
      if (Object.keys(selected).length === folder.emojis.length) clearSelection();
      else folder.emojis.forEach(function (e) { selected[e.id] = true; });
      render();
    });

    modeBar.querySelector('#moveSelBtn').addEventListener('click', function () {
      var ids = Object.keys(selected);
      if (!ids.length) { toast('選択されていません'); return; }
      openFolderPicker(ids);
    });

    modeBar.querySelector('#delSelBtn').addEventListener('click', deleteSelected);
  }

  /* =====================================================
     モード
  ===================================================== */
  function clearSelection() { selected = {}; }

  function setMode(next) {
    mode = (mode === next) ? 'normal' : next;
    if (mode !== 'select') clearSelection();
    render();
  }

  editBtn.addEventListener('click', function () { setMode('edit'); });
  selectBtn.addEventListener('click', function () { setMode('select'); });
  menuBtn.addEventListener('click', openMainMenu);

  nameBtn.addEventListener('click', function () {
    showNames = !showNames;
    storageSet(NAMES_KEY, showNames ? '1' : '0');
    renderToolbar();
    scheduleResizeEmojis();
    if (showNames) {
      var folder = getActiveFolder();
      var named = folder.emojis.some(function (e) { return e.name && e.name.length; });
      if (!named) toast('絵文字を長押し →「名前をつける」');
      else toast('名前を表示');
    } else {
      toast('名前を非表示');
    }
  });

  /* =====================================================
     削除 / フォルダ移動
  ===================================================== */
  function deleteSelected() {
    var ids = Object.keys(selected);
    if (!ids.length) { toast('選択されていません'); return; }

    confirmDialog(ids.length + ' 個の絵文字を削除しますか？', '削除', function () {
      var folder = getActiveFolder();
      folder.emojis = folder.emojis.filter(function (e) { return !selected[e.id]; });
      clearSelection();
      save();
      render();
      toast('削除しました');
    });
  }

  function openFolderPicker(ids) {
    var others = state.folders.filter(function (f) { return f.id !== state.activeFolderId; });
    if (others.length === 0) {
      toast('他のフォルダがありません');
      return;
    }

    var html = '<div class="modal-title">移動先を選択</div><div class="modal-list">';
    others.forEach(function (f) {
      html += '<button class="modal-item" data-folder="' + f.id + '" type="button">📁 ' + escapeHtml(f.name) + '</button>';
    });
    html += '<button class="modal-item" data-act="cancel" type="button">キャンセル</button></div>';

    openModal(html, function (root) {
      var btns = root.querySelectorAll('[data-folder]');
      Array.prototype.forEach.call(btns, function (btn) {
        btn.addEventListener('click', function () {
          moveSelectedTo(btn.dataset.folder, ids);
          closeModal();
        });
      });
      root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
    });
  }

  function moveSelectedTo(targetFolderId, ids) {
    var from = getActiveFolder();
    var to = getFolder(targetFolderId);
    if (!to) return;

    var moving = [];
    from.emojis = from.emojis.filter(function (e) {
      if (ids.indexOf(e.id) !== -1) { moving.push(e); return false; }
      return true;
    });

    var existing = {};
    to.emojis.forEach(function (e) { existing[e.char] = true; });

    var added = 0;
    moving.forEach(function (e) {
      if (!existing[e.char]) {
        to.emojis.push(e);
        existing[e.char] = true;
        added++;
      }
    });

    sortEmojis(to);

    clearSelection();
    save();
    render();
    toast(added + ' 個を「' + to.name + '」に移動しました');
  }

  /* =====================================================
     絵文字パース
  ===================================================== */
  function parseEmojis(text) {
    var segments;
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      var seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
      segments = Array.from(seg.segment(text), function (s) { return s.segment; });
    } else {
      segments = Array.from(text);
    }

    var out = [];
    for (var i = 0; i < segments.length; i++) {
      if (isEmojiGrapheme(segments[i])) out.push(segments[i]);
    }
    return out;
  }

  function isEmojiGrapheme(segment) {
    if (!segment || !segment.trim()) return false;
    if (/^[\x00-\x7F]+$/.test(segment) && !/[\u20E3\uFE0F]/.test(segment)) return false;
    try {
      return /[\p{Extended_Pictographic}\p{Emoji_Presentation}\p{Regional_Indicator}\u20E3]/u.test(segment);
    } catch (e) {
      return /[\u203C-\u3299\uD83C-\uDBFF\uDC00-\uDFFF\u2600-\u27BF]/.test(segment);
    }
  }

  /* =====================================================
     追加シート
  ===================================================== */
  function openPasteSheet() {
    openModal(
      '<div class="modal-title">「' + escapeHtml(getActiveFolder().name) + '」に追加</div>' +
      '<textarea id="pasteArea" class="modal-textarea" placeholder="複数の絵文字を追加できます"></textarea>' +
      '<div class="modal-actions">' +
        '<button class="btn" data-act="cancel" type="button">キャンセル</button>' +
        '<button class="btn primary" data-act="add" type="button">追加</button>' +
      '</div>',
      function (root) {
        var ta = root.querySelector('#pasteArea');
        setTimeout(function () { ta.focus(); }, 60);

        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
        root.querySelector('[data-act="add"]').addEventListener('click', function () {
          var emojis = parseEmojis(ta.value);
          if (emojis.length === 0) { toast('絵文字が見つかりませんでした'); return; }

          var folder = getActiveFolder();
          var existing = {};
          folder.emojis.forEach(function (e) { existing[e.char] = true; });

          var added = 0;
          emojis.forEach(function (ch) {
            if (!existing[ch]) {
              folder.emojis.push({ id: uuid(), char: ch, status: 'normal', name: '' });
              existing[ch] = true;
              added++;
            }
          });

          sortEmojis(folder);
          save();
          render();
          closeModal();
          toast(added + ' 個追加しました');
        });
      }
    );
  }

  /* =====================================================
     フォルダ操作
  ===================================================== */
  function openFolderCreate() {
    openModal(
      '<div class="modal-title">新しいフォルダ</div>' +
      '<input id="folderNameInput" class="modal-input" type="text" maxlength="40" placeholder="フォルダ名">' +
      '<div class="modal-actions">' +
        '<button class="btn" data-act="cancel" type="button">キャンセル</button>' +
        '<button class="btn primary" data-act="ok" type="button">作成</button>' +
      '</div>',
      function (root) {
        var inp = root.querySelector('#folderNameInput');
        setTimeout(function () { inp.focus(); }, 60);

        function commit() {
          var v = inp.value.trim();
          if (!v) { toast('名前を入力してください'); return; }
          var id = uuid();
          state.folders.push({ id: id, name: v, emojis: [] });
          state.activeFolderId = id;
          save();
          render();
          closeModal();
          toast('フォルダを作成しました');
        }

        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
        root.querySelector('[data-act="ok"]').addEventListener('click', commit);
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
        });
      }
    );
  }

  function openTabMenu(folder) {
    openModal(
      '<div class="modal-title">' + escapeHtml(folder.name) + '</div>' +
      '<div class="modal-list">' +
        '<button class="modal-item" data-act="rename" type="button">✏️ 名前を変更</button>' +
        '<button class="modal-item" data-act="clear" type="button">🧹 中の絵文字を全削除</button>' +
        '<button class="modal-item danger" data-act="delete" type="button">🗑️ フォルダを削除</button>' +
        '<button class="modal-item" data-act="cancel" type="button">キャンセル</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="rename"]').addEventListener('click', function () {
          closeModal();
          openFolderRename(folder);
        });
        root.querySelector('[data-act="clear"]').addEventListener('click', function () {
          closeModal();
          if (folder.emojis.length === 0) { toast('空です'); return; }
          confirmDialog('「' + folder.name + '」の絵文字をすべて削除しますか？', '削除', function () {
            folder.emojis = [];
            save();
            render();
            toast('削除しました');
          });
        });
        root.querySelector('[data-act="delete"]').addEventListener('click', function () {
          closeModal();
          deleteFolder(folder);
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
      }
    );
  }

  function openFolderRename(folder) {
    openModal(
      '<div class="modal-title">フォルダ名を変更</div>' +
      '<input id="renameInput" class="modal-input" type="text" maxlength="40" value="' + escapeHtml(folder.name) + '">' +
      '<div class="modal-actions">' +
        '<button class="btn" data-act="cancel" type="button">キャンセル</button>' +
        '<button class="btn primary" data-act="ok" type="button">OK</button>' +
      '</div>',
      function (root) {
        var inp = root.querySelector('#renameInput');
        setTimeout(function () { inp.focus(); inp.select(); }, 60);

        function commit() {
          var v = inp.value.trim();
          if (!v) { toast('名前を入力してください'); return; }
          folder.name = v;
          save();
          render();
          closeModal();
        }

        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
        root.querySelector('[data-act="ok"]').addEventListener('click', commit);
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
        });
      }
    );
  }

  function deleteFolder(folder) {
    if (state.folders.length <= 1) { toast('最後のフォルダは削除できません'); return; }
    confirmDialog('「' + folder.name + '」を削除しますか？中の絵文字も消えます。', '削除', function () {
      state.folders = state.folders.filter(function (f) { return f.id !== folder.id; });
      if (state.activeFolderId === folder.id) state.activeFolderId = state.folders[0].id;
      clearSelection();
      save();
      render();
      toast('削除しました');
    });
  }

  /* =====================================================
     メインメニュー
  ===================================================== */
  var pendingImportMode = 'replace';

  function openMainMenu() {
    openModal(
      '<div class="modal-title">メニュー</div>' +
      '<div class="modal-list">' +
        '<button class="modal-item" data-act="export" type="button">📤 全フォルダをエクスポート</button>' +
        '<button class="modal-item" data-act="import" type="button">📥 インポート（置き換え）</button>' +
        '<button class="modal-item" data-act="import-merge" type="button">➕ インポート（追加）</button>' +
        '<button class="modal-item" data-act="cancel" type="button">キャンセル</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="export"]').addEventListener('click', function () {
          closeModal();
          exportAll();
        });
        root.querySelector('[data-act="import"]').addEventListener('click', function () {
          closeModal();
          pendingImportMode = 'replace';
          fileInput.click();
        });
        root.querySelector('[data-act="import-merge"]').addEventListener('click', function () {
          closeModal();
          pendingImportMode = 'merge';
          fileInput.click();
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
      }
    );
  }

  function exportAll() {
    var data = {
      version: 5,
      app: 'emoji-registry',
      exportedAt: new Date().toISOString(),
      folders: state.folders,
      activeFolderId: state.activeFolderId
    };

    var json = JSON.stringify(data, null, 2);
    var filename = 'emoji-notebook-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';

    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast('エクスポートしました');
    } catch (e) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(function () {
          toast('JSONをコピーしました');
        }).catch(function () {
          toast('エクスポートに失敗しました');
        });
      } else {
        toast('エクスポートに失敗しました');
      }
    }
  }

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    fileInput.value = '';
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var folders = null;
      try {
        var parsed = JSON.parse(String(reader.result));
        folders = normalizeFolders(parsed);
      } catch (err) { folders = null; }

      if (!folders) { toast('読み込めないファイルです'); return; }

      if (pendingImportMode === 'replace') {
        confirmDialog(
          '現在のデータをすべて置き換えます。よろしいですか？\n（' + folders.length + ' フォルダ）',
          '置き換え',
          function () {
            state.folders = folders;
            state.activeFolderId = folders[0].id;
            clearSelection();
            save();
            render();
            toast('インポートしました');
          }
        );
      } else {
        var added = 0;
        var byName = {};
        state.folders.forEach(function (f) { byName[f.name] = f; });

        folders.forEach(function (f) {
          if (byName[f.name]) {
            var target = byName[f.name];
            var chars = {};
            target.emojis.forEach(function (e) { chars[e.char] = true; });
            f.emojis.forEach(function (e) {
              if (!chars[e.char]) {
                target.emojis.push({ id: uuid(), char: e.char, status: e.status, name: e.name || '' });
                chars[e.char] = true;
                added++;
              }
            });
            sortEmojis(target);
          } else {
            var nf = { id: uuid(), name: f.name, emojis: f.emojis };
            state.folders.push(nf);
            byName[f.name] = nf;
            added += f.emojis.length;
          }
        });

        save();
        render();
        toast(added + ' 個追加しました');
      }
    };
    reader.readAsText(file);
  });

  /* =====================================================
     絵文字タイル操作
  ===================================================== */
  var suppressTap = false;
  var gesture = null;
  var dragState = null;
  var ghost = null;
  var insertLineEl = null;
  var dragInsert = null;

  function ensureInsertLine() {
    insertLineEl = document.createElement('div');
    insertLineEl.className = 'insert-line';
    gridEl.appendChild(insertLineEl);
  }

  function showInsertLine() {
    if (!insertLineEl) return;
    insertLineEl.style.display = 'block';
  }

  function hideInsertLine() {
    if (!insertLineEl) return;
    insertLineEl.style.display = 'none';
  }

  gridEl.addEventListener('pointerdown', function (e) {
    var tile = e.target.closest('.tile');
    if (!tile) return;
    if (tile.classList.contains('add-tile')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    var id = tile.dataset.id;
    var folderId = tile.dataset.folder;
    var char = tile.dataset.char;

    if (mode === 'select') {
      e.preventDefault();
      if (selected[id]) delete selected[id];
      else selected[id] = true;
      render();
      return;
    }

    if (mode === 'edit') {
      e.preventDefault();
      startDrag(e, tile, id, folderId, char);
      return;
    }

    startGesture(e, tile, id, folderId, char);
  });

  /* ---- 通常モード：タップ・スワイプ・長押し ---- */
  function startGesture(e, tile, id, folderId, char) {
    gesture = {
      id: id,
      folderId: folderId,
      char: char,
      tile: tile,
      x0: e.clientX,
      y0: e.clientY,
      dx: 0,
      swiping: false,
      longPressed: false,
      moved: false,
      pid: e.pointerId,
      longTimer: null
    };

    gesture.longTimer = setTimeout(function () {
      if (!gesture) return;
      if (gesture.moved || gesture.swiping) return;
      gesture.longPressed = true;
      suppressTap = true;
      openEmojiMenu(gesture.id);
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
    }, 500);

    window.addEventListener('pointermove', onGestureMove, { passive: false });
    window.addEventListener('pointerup', onGestureEnd);
    window.addEventListener('pointercancel', onGestureCancel);
  }

  function onGestureMove(e) {
    if (!gesture || e.pointerId !== gesture.pid) return;

    var dx = e.clientX - gesture.x0;
    var dy = e.clientY - gesture.y0;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 8) {
      gesture.moved = true;
      if (gesture.longTimer) {
        clearTimeout(gesture.longTimer);
        gesture.longTimer = null;
      }
    }

    if (!gesture.swiping) {
      if (Math.abs(dx) < 14) return;
      if (Math.abs(dx) <= Math.abs(dy)) return;
      gesture.swiping = true;
      gesture.tile.style.transition = 'none';
      gesture.tile.style.zIndex = '5';
    }

    gesture.dx = dx;
    var capped = Math.max(-140, Math.min(140, dx));
    gesture.tile.style.transform = 'translateX(' + capped + 'px)';
    gesture.tile.classList.toggle('swipe-fav', dx < -50);
    gesture.tile.classList.toggle('swipe-unused', dx > 50);
  }

  function onGestureEnd() {
    window.removeEventListener('pointermove', onGestureMove);
    window.removeEventListener('pointerup', onGestureEnd);
    window.removeEventListener('pointercancel', onGestureCancel);

    if (!gesture) return;
    var g = gesture;
    gesture = null;

    if (g.longTimer) { clearTimeout(g.longTimer); g.longTimer = null; }

    g.tile.style.transition = '';
    g.tile.style.transform = '';
    g.tile.style.zIndex = '';
    g.tile.classList.remove('swipe-fav', 'swipe-unused');

    if (g.longPressed) {
      setTimeout(function () { suppressTap = false; }, 0);
      return;
    }

    if (!g.swiping) {
      insertEmojiToInput(g.char);
      return;
    }

    if (g.dx < -55) setStatus(g.id, 'favorite');
    else if (g.dx > 55) setStatus(g.id, 'unused');
  }

  function onGestureCancel() {
    window.removeEventListener('pointermove', onGestureMove);
    window.removeEventListener('pointerup', onGestureEnd);
    window.removeEventListener('pointercancel', onGestureCancel);

    if (!gesture) return;
    var g = gesture;
    gesture = null;

    if (g.longTimer) clearTimeout(g.longTimer);
    g.tile.style.transition = '';
    g.tile.style.transform = '';
    g.tile.style.zIndex = '';
    g.tile.classList.remove('swipe-fav', 'swipe-unused');
  }

  function setStatus(id, status) {
    var found = getEmojiById(id);
    if (!found) return;
    var emoji = found.emoji;
    var next = (emoji.status === status) ? 'normal' : status;
    emoji.status = next;
    sortEmojis(found.folder);
    save();
    render();

    if (next === 'favorite') toast('★ お気に入り');
    else if (next === 'unused') toast('− 使わない');
    else toast('通常に戻しました');
  }

  /* ---- 絵文字メニュー ---- */
  function openEmojiMenu(id) {
    var found = getEmojiById(id);
    if (!found) return;
    var e = found.emoji;

    var favLabel = e.status === 'favorite' ? '★ お気に入りを解除' : '★ お気に入りにする';
    var unusedLabel = e.status === 'unused' ? '− 使わないを解除' : '− 使わないにする';

    openModal(
      '<div class="modal-title"><span style="font-size:22px">' + escapeHtml(e.char) + '</span>' +
        (e.name ? '　' + escapeHtml(e.name) : '') + '</div>' +
      '<div class="modal-list">' +
        '<button class="modal-item" data-act="name" type="button">🏷️ 名前を' +
          (e.name ? '編集' : 'つける') + '</button>' +
        '<button class="modal-item" data-act="fav" type="button">' + favLabel + '</button>' +
        '<button class="modal-item" data-act="unused" type="button">' + unusedLabel + '</button>' +
        '<button class="modal-item danger" data-act="delete" type="button">🗑️ 削除</button>' +
        '<button class="modal-item" data-act="cancel" type="button">キャンセル</button>' +
      '</div>',
      function (root) {
        root.querySelector('[data-act="name"]').addEventListener('click', function () {
          closeModal();
          openNameEditor(id);
        });
        root.querySelector('[data-act="fav"]').addEventListener('click', function () {
          closeModal();
          setStatus(id, 'favorite');
        });
        root.querySelector('[data-act="unused"]').addEventListener('click', function () {
          closeModal();
          setStatus(id, 'unused');
        });
        root.querySelector('[data-act="delete"]').addEventListener('click', function () {
          closeModal();
          confirmDialog('この絵文字を削除しますか？', '削除', function () {
            var f = getEmojiById(id);
            if (!f) return;
            f.folder.emojis = f.folder.emojis.filter(function (x) { return x.id !== id; });
            save();
            render();
            toast('削除しました');
          });
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
      }
    );
  }

  function openNameEditor(id) {
    var found = getEmojiById(id);
    if (!found) return;
    var e = found.emoji;

    openModal(
      '<div class="modal-title"><span style="font-size:22px">' + escapeHtml(e.char) + '</span> の名前</div>' +
      '<input id="nameInput" class="modal-input" type="text" maxlength="30" value="' + escapeHtml(e.name || '') + '" placeholder="例：笑顔">' +
      '<div class="modal-actions">' +
        '<button class="btn" data-act="clear" type="button">名前をクリア</button>' +
        '<button class="btn" data-act="cancel" type="button">キャンセル</button>' +
        '<button class="btn primary" data-act="ok" type="button">保存</button>' +
      '</div>',
      function (root) {
        var inp = root.querySelector('#nameInput');
        setTimeout(function () { inp.focus(); inp.select(); }, 60);

        function commit(v) {
          e.name = (v || '').trim();
          save();
          render();
          closeModal();
          if (e.name) {
            if (!showNames) toast('🏷️ を押すと名前を表示します');
            else toast('名前を保存しました');
          } else {
            toast('名前をクリアしました');
          }
        }

        root.querySelector('[data-act="clear"]').addEventListener('click', function () {
          commit('');
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', closeModal);
        root.querySelector('[data-act="ok"]').addEventListener('click', function () {
          commit(inp.value);
        });
        inp.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); commit(inp.value); }
        });
      }
    );
  }

  /* ---- 編集モード：ドラッグ ---- */
  function startDrag(e, tile, id, folderId, char) {
    var rect = tile.getBoundingClientRect();
    dragState = {
      id: id,
      folderId: folderId,
      char: char,
      tile: tile,
      x0: e.clientX,
      y0: e.clientY,
      pointerX: e.clientX,
      pointerY: e.clientY,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      w: rect.width,
      h: rect.height,
      active: false,
      pid: e.pointerId,
      raf: null
    };

    window.addEventListener('pointermove', onDragMove, { passive: false });
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragCancel);
  }

  function onDragMove(e) {
    if (!dragState || e.pointerId !== dragState.pid) return;

    dragState.pointerX = e.clientX;
    dragState.pointerY = e.clientY;

    var dx = e.clientX - dragState.x0;
    var dy = e.clientY - dragState.y0;

    if (!dragState.active) {
      if (Math.sqrt(dx * dx + dy * dy) < 7) return;
      dragState.active = true;
      suppressTap = true;

      ghost = dragState.tile.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.classList.remove('dragging', 'drop-target');
      ghost.style.width = dragState.w + 'px';
      ghost.style.height = dragState.h + 'px';

      var charEl = ghost.querySelector('.char');
      var srcChar = dragState.tile.querySelector('.char');
      if (charEl && srcChar) charEl.style.fontSize = srcChar.style.fontSize;

      document.body.appendChild(ghost);
      dragState.tile.classList.add('dragging');
      showInsertLine();
    }

    e.preventDefault();

    if (!dragState.raf) {
      dragState.raf = requestAnimationFrame(flushDrag);
    }
  }

  function flushDrag() {
    if (!dragState) return;
    dragState.raf = null;
    if (!dragState.active) return;

    var gx = dragState.pointerX - dragState.offsetX;
    var gy = dragState.pointerY - dragState.offsetY;

    if (ghost) {
      ghost.style.transform = 'translate3d(' + gx + 'px, ' + gy + 'px, 0)';
    }

    updateInsertPosition(dragState.pointerX, dragState.pointerY);
  }

  function updateInsertPosition(x, y) {
    var found = getEmojiById(dragState.id);
    if (!found) return;
    var dragStatus = found.emoji.status;

    var tiles = gridEl.querySelectorAll('.tile:not(.add-tile):not(.dragging)');
    var candidates = [];
    Array.prototype.forEach.call(tiles, function (t) {
      var fe = getEmojiById(t.dataset.id);
      if (fe && fe.emoji.status === dragStatus) candidates.push(t);
    });

    if (candidates.length === 0) {
      dragInsert = null;
      hideInsertLine();
      return;
    }

    var nearest = null;
    var minD2 = Infinity;
    for (var i = 0; i < candidates.length; i++) {
      var t = candidates[i];
      var r = t.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var ddx = x - cx;
      var ddy = y - cy;
      var d2 = ddx * ddx + ddy * ddy;
      if (d2 < minD2) { minD2 = d2; nearest = { tile: t, rect: r, cx: cx, cy: cy }; }
    }

    if (!nearest) { hideInsertLine(); dragInsert = null; return; }

    var before;
    if (Math.abs(y - nearest.cy) > Math.abs(x - nearest.cx) * 0.6) {
      before = y < nearest.cy;
    } else {
      before = x < nearest.cx;
    }

    dragInsert = { targetId: nearest.tile.dataset.id, before: before };
    positionInsertLine(nearest.rect, before);
  }

  function positionInsertLine(rect, before) {
    if (!insertLineEl) return;
    var gridRect = gridEl.getBoundingClientRect();
    var left = rect.left - gridRect.left;
    var top = rect.top - gridRect.top;

    var gap = 8;
    var lineW = 4;

    if (before) {
      left -= (gap / 2 + lineW / 2 - 1);
    } else {
      left += rect.width + gap / 2 - lineW / 2 + 1;
    }

    insertLineEl.style.left = left + 'px';
    insertLineEl.style.top = top + 'px';
    insertLineEl.style.height = rect.height + 'px';
  }

  function onDragEnd() {
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragCancel);

    if (!dragState) return;
    var d = dragState;
    dragState = null;

    if (d.raf) cancelAnimationFrame(d.raf);

    if (ghost) {
      if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
      ghost = null;
    }
    d.tile.classList.remove('dragging');
    hideInsertLine();

    if (!d.active) {
      suppressTap = false;
      return;
    }

    if (dragInsert) {
      applyReorder(d.id, dragInsert.targetId, dragInsert.before);
    }

    dragInsert = null;

    setTimeout(function () { suppressTap = false; }, 0);
  }

  function onDragCancel() {
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragCancel);

    if (!dragState) return;
    var d = dragState;
    dragState = null;

    if (d.raf) cancelAnimationFrame(d.raf);
    if (ghost) { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); ghost = null; }
    d.tile.classList.remove('dragging');
    hideInsertLine();
    dragInsert = null;
    suppressTap = false;
  }

  function applyReorder(dragId, targetId, before) {
    var folder = getActiveFolder();

    var dragIdx = -1;
    for (var i = 0; i < folder.emojis.length; i++) {
      if (folder.emojis[i].id === dragId) { dragIdx = i; break; }
    }
    if (dragIdx === -1) return;

    var item = folder.emojis.splice(dragIdx, 1)[0];

    var targetIdx = -1;
    for (var j = 0; j < folder.emojis.length; j++) {
      if (folder.emojis[j].id === targetId) { targetIdx = j; break; }
    }

    if (targetIdx === -1) {
      folder.emojis.push(item);
    } else {
      folder.emojis.splice(before ? targetIdx : targetIdx + 1, 0, item);
    }

    sortEmojis(folder);
    save();
    render();
  }

  /* =====================================================
     下部入力欄
  ===================================================== */
  function autoGrow() {
    inputArea.style.height = 'auto';
    inputArea.style.height = Math.min(inputArea.scrollHeight, 130) + 'px';
  }

  function insertEmojiToInput(ch) {
    var start = inputArea.selectionStart;
    var end = inputArea.selectionEnd;

    if (typeof start !== 'number' || start === null) {
      start = inputArea.value.length;
      end = start;
    }

    inputArea.value = inputArea.value.slice(0, start) + ch + inputArea.value.slice(end);
    var pos = start + ch.length;

    try { inputArea.setSelectionRange(pos, pos); } catch (e) {}

    autoGrow();
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
  }

  inputArea.addEventListener('input', autoGrow);

  $('copyInputBtn').addEventListener('click', function () {
    var text = inputArea.value;
    if (!text) { toast('空です'); return; }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('コピーしました');
      }).catch(function () {
        fallbackCopy(text) ? toast('コピーしました') : toast('コピーできませんでした');
      });
    } else {
      fallbackCopy(text) ? toast('コピーしました') : toast('コピーできませんでした');
    }
  });

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  /* =====================================================
     ズーム・選択防止
  ===================================================== */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('gestureend', function (e) { e.preventDefault(); });

  document.addEventListener('contextmenu', function (e) {
    if (e.target.closest && e.target.closest('.tile, .tab, .icon-btn, .app-title, .col-control')) {
      e.preventDefault();
    }
  });

  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 320) {
      if (e.cancelable) e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  /* =====================================================
     初期化
  ===================================================== */
  loadState();
  applyCols(loadCols());

  if (!storageAvailable) {
    $('storageWarning').classList.add('show');
  }

  render();
  autoGrow();
  save();
})();
</script>
</body>
</html>
